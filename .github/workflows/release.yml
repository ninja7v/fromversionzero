name: Release

# Push a tag like v1.0.0 (matching fromversionzero.__version__) to publish
# a GitHub release with the built sdist and wheel attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches package version
        run: |
          version=$(uv run --no-project python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/fromversionzero/__init__.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME"
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - run: uv build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "$notes"
