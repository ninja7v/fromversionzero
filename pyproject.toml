[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fromversionzero"
dynamic = ["version"]
description = "Render animated product-evolution videos (landscape and Shorts) from timeline datasets."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{name = "Luc Prevost"}]
keywords = ["video", "visualization", "timeline", "animation", "data-storytelling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "imageio-ffmpeg>=0.6.0",
    "resvg-py>=0.5.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.17.4",
    "mypy>=1.11",
    "lizard>=1.17",
]

[project.scripts]
fromversionzero = "fromversionzero.cli:main"

[project.urls]
Homepage = "https://github.com/ninja7v/fromversionzero"
Repository = "https://github.com/ninja7v/fromversionzero"
Issues = "https://github.com/ninja7v/fromversionzero/issues"
Changelog = "https://github.com/ninja7v/fromversionzero/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "fromversionzero.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fromversionzero" = ["py.typed"]
"fromversionzero.resources" = ["*.ttf", "*.txt", "icons/*.svg", "branding/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
markers = [
    "datasets: validates the example dataset in examples/",
]
# Resources left for garbage collection to clean up (e.g. an unclosed pipe to
# FFmpeg) fail the test instead of printing a warning.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["fromversionzero"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["resvg_py", "imageio_ffmpeg"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
